<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/"><!-- ให้ relative asset (logo.png ฯลฯ) resolve จาก server root เหมือน deployment จริง -->
<title>DMJ headless test harness</title>
<style>:root{--muted:#6b7280;--g-50:#f0f5ee;--g-500:#3f9d5a;--g-700:#1f6f3f;--bdr:#e5e7eb;--dang:#dc2626;--warn:#f59e0b;--gold:#a07417;--light:#9ca3af}body{margin:0;font-family:sans-serif}</style>
</head>
<body>
<div id="root"></div>

<!-- libs (vendored locally via setup.sh — CDN ถูกบล็อกในสภาพแวดล้อมทดสอบ) -->
<script src="/tests/browser/vendor/react.js"></script>
<script src="/tests/browser/vendor/react-dom.js"></script>
<script src="/tests/browser/vendor/prop-types.js"></script>
<script defer src="/tests/browser/vendor/recharts.js"></script>
<script src="/tests/browser/vendor/babel.js"></script>

<!-- fixture + stubs: ต้องรันก่อน config.js/app.jsx -->
<script src="/tests/browser/fixture.js"></script>
<script>
(function () {
  // ── seed role/tab จาก query param (?role=owner&tab=overview) — bypass login ──
  const q = new URLSearchParams(location.search);
  const role = q.get('role') || 'owner';
  const tab  = q.get('tab');
  sessionStorage.setItem('dmj_role', role);
  if (tab) sessionStorage.setItem('dmj_active_tab', tab); // เผื่อ app อ่าน (ไม่บังคับ)

  // ── จำลอง "ล็อกอินแล้ว" ── ปกติ applyStaffSession() (app.jsx) เป็นคนตั้งค่าพวกนี้ตอน login
  // ต้อง seed เองเพราะ harness bypass login · ถ้าไม่ตั้ง MyJobsCard ("งานของฉัน") จะคืน null
  // ตลอด → เทสต์จะไม่มีวันเห็นการ์ดนี้เลย (ผ่านแบบไม่ได้ทดสอบอะไร)
  // ค่า staffId ตรงกับ assigneeId ของงาน MTO ใน fixture.js — แก้ที่ไหนต้องแก้ให้ตรงกัน
  window._currentStaffId  = 'STF001';
  window._currentUserName = 'สมชาย';
  window._currentUser     = 'สมชาย (' + role + ')';

  // ── จำลองการตัด payload ตาม role แบบเดียวกับ GAS (PAYLOAD_VARIANT_DROPS_) ──
  // ต้อง mirror ไว้ที่นี่ ไม่งั้นเทสต์จะรันด้วย payload เต็มตลอด แล้วไม่มีวันจับได้ว่า
  // "view ของ role นี้ต้องใช้คีย์ที่ server ตัดทิ้งไป" ซึ่งคือความเสี่ยงหลักของการแยกตาม role
  // ⚠️ แก้ PAYLOAD_VARIANT_DROPS_ ใน appsscript_complete.gs แล้วต้องอัปเดตตารางนี้ด้วย
  var VARIANT_DROPS = {
    full: [],
    ops:  ['monthlyByCat', 'dailyByCat', 'dayLabels', 'purchases'],
    lite: ['monthlyByCat', 'dailyByCat', 'dayLabels', 'purchases', 'transfers', 'transferStats'],
  };
  var ROLE_VARIANT = {
    owner: 'full', dev: 'full', employee: 'ops',
    warehouse: 'lite', frontstore: 'lite', saler: 'lite', storedevice: 'lite',
  };
  function shapeForRole(payload, r) {
    var drops = VARIANT_DROPS[ROLE_VARIANT[r] || 'full'] || [];
    if (!drops.length) return payload;
    var out = {};
    Object.keys(payload).forEach(function (k) { if (drops.indexOf(k) < 0) out[k] = payload[k]; });
    return out;
  }
  window.__DMJ_PAYLOAD = shapeForRole(window.__DMJ_FIXTURE, role);

  // ── seed ข้อมูลลง localStorage เพื่อให้ loadFromStorage() render ทันที ──
  localStorage.setItem('dmj_dashboard_data_v1', JSON.stringify(window.__DMJ_PAYLOAD));
  localStorage.setItem('dmj_dashboard_source_v1', 'sheet');
  // กระดิ่งแจ้งเตือนยิง GET เฉพาะเมื่อมี session token — ไม่ seed = กระดิ่งไม่เคยถูกทดสอบเลย
  localStorage.setItem('dmj_session_token', 'harness-token');

  // ── stub fetch: ตัด network จริงทั้งหมด → ตอบ fixture/verifyPin ──
  const realFetch = window.fetch;
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    // GAS GET (payload) — ตอบ fixture
    const body = (init && init.body) || '';
    const isVerifyPin = /verifyPin/.test(url) || /verifyPin/.test(String(body));
    if (isVerifyPin) return Promise.resolve(new Response(JSON.stringify({ ok: true }), { headers: { 'Content-Type': 'application/json' } }));
    // POST actions (write) — ตอบ success จำลอง · action ลงเวลาต้องตอบให้ครบ field
    // (views-attendance.jsx อ่าน today.events/rows ตรง ๆ — payload ว่างจะได้แค่หน้าเปล่า ไม่ได้ทดสอบอะไร)
    if (init && init.method === 'POST') {
      let action = '';
      try { action = (JSON.parse(body) || {}).action || ''; } catch (e) {}
      // action=me ต้องตอบรูปแบบจริง {ok:true, staff:{...}} — ตอบ {success:true} เฉย ๆ
      // จะทำให้ checkMe() ลบ dmj_session_token ทิ้งแล้วเด้งไปหน้าล็อกอิน (ของจริงไม่เป็นแบบนั้น)
      // ผลข้างเคียงที่เคยมองไม่เห็น: ทุกอย่างที่ต้องใช้ token (เช่นกระดิ่งแจ้งเตือน) ไม่เคยถูกทดสอบเลย
      if (action === 'me') {
        // ⚠️ staffId ต้องเป็น 'STF001' ให้ตรงกับที่ seed ไว้ข้างบน + assigneeId ใน fixture.js
        // เพราะ applyStaffSession() (app.jsx) **เขียนทับ** window._currentStaffId ด้วยค่าจากตรงนี้
        // ใส่เลขอื่นเมื่อไหร่ MyJobsCard ("งานของฉัน") จะหางานของตัวเองไม่เจอแล้วคืน null เงียบ ๆ
        return Promise.resolve(new Response(JSON.stringify({
          ok: true,
          staff: { staffId: 'STF001', name: 'ทดสอบ ระบบ', role: role, status: 'active', pictureUrl: '' },
        }), { headers: { 'Content-Type': 'application/json' } }));
      }
      const att = window.__DMJ_ATT_FIXTURE || {};
      const data = Object.prototype.hasOwnProperty.call(att, action) ? att[action] : {};
      return Promise.resolve(new Response(JSON.stringify({ success: true, data: data }), { headers: { 'Content-Type': 'application/json' } }));
    }
    // แจ้งเตือนในแอป (กระดิ่ง) — ต้องมาก่อน branch payload รวม ไม่งั้นจะได้ payload สินค้าแทน
    if (/action=inappNoti/.test(url)) {
      return Promise.resolve(new Response(JSON.stringify(window.__DMJ_NOTI_FIXTURE || { ok: true, items: [], unread: 0 }),
        { headers: { 'Content-Type': 'application/json' } }));
    }
    // GET payload
    if (/script\.google|exec|action=orders|action=getAuditLog|action=getDeadStock/.test(url) || url.indexOf('http') === 0) {
      const payload = Object.assign({}, window.__DMJ_PAYLOAD, { lastModified: Date.now() });
      return Promise.resolve(new Response(JSON.stringify(payload), { headers: { 'Content-Type': 'application/json' } }));
    }
    return realFetch ? realFetch(input, init) : Promise.reject(new Error('fetch blocked in harness: ' + url));
  };
  window.__TAB = tab; // ให้ test script รู้ว่าจะ navigate ไป tab ไหน
})();
</script>
<script src="/config.js"></script>

<!-- boot: mirror ของจริง (ui → views-main → views-analytics → views-quote → views-attendance → app)
     แต่ libs local · ลำดับต้องตรงกับ "Doomuenjing Dashboard.html" เป๊ะ ไม่งั้น component หาย
     (เช่น AttendanceView ไม่ถูกประกาศ → ทุก role ที่มีแท็บ "attendance" white-screen) -->
<script>
(function () {
  function injectCode(code) { const s = document.createElement('script'); s.textContent = code; document.head.appendChild(s); }
  async function compileJsx(src) {
    const resp = await fetch(src);
    const text = await resp.text();
    return Babel.transform(text, { presets: ['react'], sourceType: 'script', filename: src }).code;
  }
  // compile ขนานกัน (เร็วกว่า) แต่ inject ตามลำดับเสมอ — global scope เดียวกัน ลำดับสำคัญ
  const ORDER = ['/views-main.jsx', '/views-analytics.jsx', '/views-quote.jsx', '/views-attendance.jsx'];
  compileJsx('/ui.jsx').then(injectCode)
    .then(() => Promise.all(ORDER.map(compileJsx)))
    .then((codes) => { codes.forEach(injectCode); return compileJsx('/app.jsx').then(injectCode); })
    .then(() => { window.__BOOTED = true; })
    .catch((e) => { window.__BOOT_ERR = String(e && e.stack || e); });
}());
</script>
</body>
</html>
