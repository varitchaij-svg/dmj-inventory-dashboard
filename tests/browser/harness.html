<!-- เครื่องมือวัดเวลาเปิดแอป — ของจริงประกาศไว้เป็นสคริปต์ตัวแรกใน <head> ของ
     "Doomuenjing Dashboard.html" · ที่นี่ต้องมีเหมือนกัน เพราะ app.jsx/HTML loader
     เรียก window.dmjMark() ตรง ๆ โดยไม่เช็คก่อน (ตั้งใจ — จะได้ไม่ต้องเช็คทุกจุดเรียก)
     ⚠️ ขาดตัวนี้ = ทุก role จอขาวหมดจาก TypeError โดยที่โค้ดจริงไม่ได้ผิดอะไรเลย -->
<script>
  (function () {
    var t0 = performance.now(), marks = [];
    window.dmjMark = function (n) { marks.push([String(n), Math.round(performance.now() - t0)]); };
    window.dmjTrace = function () { return marks.slice(); };
    window.dmjSaveTrace = function () {};
    window.dmjMark('html');
  })();
</script>

<!-- libs (vendored locally via setup.sh — CDN ถูกบล็อกในสภาพแวดล้อมทดสอบ) -->

<!-- fixture + stubs: ต้องรันก่อน config.js/app.jsx -->
<script src="/tests/browser/fixture.js"></script>
<script>
(function () {
  // ── seed role/tab จาก query param (?role=owner&tab=overview) — bypass login ──
  const q = new URLSearchParams(location.search);
  const role = q.get('role') || 'owner';
  const tab  = q.get('tab');
  sessionStorage.setItem('dmj_role', role);
  if (tab) sessionStorage.setItem('dmj_active_tab', tab); // เผื่อ app อ่าน (ไม่บังคับ)

  // ── จำลอง "ล็อกอินแล้ว" ── ปกติ applyStaffSession() (app.jsx) เป็นคนตั้งค่าพวกนี้ตอน login
  // ต้อง seed เองเพราะ harness bypass login · ถ้าไม่ตั้ง MyJobsCard ("งานของฉัน") จะคืน null
  // ตลอด → เทสต์จะไม่มีวันเห็นการ์ดนี้เลย (ผ่านแบบไม่ได้ทดสอบอะไร)
  // ค่า staffId ตรงกับ assigneeId ของงาน MTO ใน fixture.js — แก้ที่ไหนต้องแก้ให้ตรงกัน
  window._currentStaffId  = 'STF001';
  window._currentUserName = 'สมชาย';
  window._currentUser     = 'สมชาย (' + role + ')';

  // ── จำลองการตัด payload ตาม role แบบเดียวกับ GAS (PAYLOAD_VARIANT_DROPS_) ──
  // ต้อง mirror ไว้ที่นี่ ไม่งั้นเทสต์จะรันด้วย payload เต็มตลอด แล้วไม่มีวันจับได้ว่า
  // "view ของ role นี้ต้องใช้คีย์ที่ server ตัดทิ้งไป" ซึ่งคือความเสี่ยงหลักของการแยกตาม role
  // ⚠️ แก้ PAYLOAD_VARIANT_DROPS_ ใน appsscript_complete.gs แล้วต้องอัปเดตตารางนี้ด้วย
  var VARIANT_DROPS = {
    full: [],
    ops:  ['monthlyByCat', 'dailyByCat', 'dayLabels', 'purchases'],
    lite: ['monthlyByCat', 'dailyByCat', 'dayLabels', 'purchases', 'transfers', 'transferStats'],
  };
  var ROLE_VARIANT = {
    owner: 'full', dev: 'full', employee: 'ops',
    warehouse: 'lite', frontstore: 'lite', saler: 'lite', storedevice: 'lite',
  };
  function shapeForRole(payload, r) {
    var drops = VARIANT_DROPS[ROLE_VARIANT[r] || 'full'] || [];
    if (!drops.length) return payload;
    var out = {};
    Object.keys(payload).forEach(function (k) { if (drops.indexOf(k) < 0) out[k] = payload[k]; });
    return out;
  }
  // ── ?checkreq=1 : จำลอง "เจ้าของส่งคำขอเช็คสต็อก" (ทดสอบแยกเคส ไม่รบกวนเทสต์อื่น) ──
  // ใส่คำขอที่มี SKU เดียว (VAS001) จากทั้งหมดหลายตัว → กด "ดูรายการ" แล้วต้องเหลือแค่ VAS001
  if (q.get('checkreq') === '1') {
    window.__DMJ_FIXTURE.stockCheckRequests = [{
      reqId: 'CHK-001', timestamp: '2026-08-14 10:00', requester: 'เจ้าของ',
      skus: ['VAS001'], names: ['แจกันแก้วใส ทรงสูง'], status: 'pending',
      completedBy: '', completedAt: '',
    }];
  }
  // ── ?fsmismatch=1 : จำลอง "ค่านับหน้าร้านเก่าไม่ตรงระบบ" (ขายไปแล้วยอดเลื่อน) ──
  // ใส่ค่านับ (frontStoreCheckedQty) ที่ต่างจาก qtyStore บน VAS001 → หน้าเช็คหน้าร้านขึ้น
  // "ไม่ตรง 1" + ปุ่ม "🧹 ล้างค่านับเก่า (1)" · แยกเคส ไม่รบกวนเทสต์อื่น
  if (q.get('fsmismatch') === '1') {
    const p = (window.__DMJ_FIXTURE.products || []).find((x) => x.sku === 'VAS001');
    if (p) { p.frontStoreCheckedQty = (p.qtyStore || 0) + 84; p.frontStoreCheckedAt = '01/08/2026 10:00'; }
  }
  window.__DMJ_PAYLOAD = shapeForRole(window.__DMJ_FIXTURE, role);

  // ── โหมด ?nodata=1 : จำลอง "ข้อมูลก้อนใหญ่ยังไม่มา" ──────────────────────
  // ใช้ทดสอบทางด่วนลงเวลา ซึ่งเป็นเส้นทางที่เทสต์ปกติ **ไม่มีวันเดินผ่าน** เพราะ
  // harness seed ข้อมูลลง localStorage ไว้ให้ตั้งแต่ต้น (data ไม่เคยเป็น null เลย)
  // → ของจริงพนักงานเปิดแอปครั้งแรกบนเครื่องใหม่จะเจอ data=null เสมอ ซึ่งไม่เคยถูกทดสอบ
  const NO_DATA = q.get('nodata') === '1';

  // ── seed ข้อมูลลง localStorage เพื่อให้ loadFromStorage() render ทันที ──
  if (!NO_DATA) {
    localStorage.setItem('dmj_dashboard_data_v1', JSON.stringify(window.__DMJ_PAYLOAD));
    localStorage.setItem('dmj_dashboard_source_v1', 'sheet');
  } else {
    localStorage.removeItem('dmj_dashboard_data_v1');
    localStorage.removeItem('dmj_dashboard_source_v1');
  }
  // กระดิ่งแจ้งเตือนยิง GET เฉพาะเมื่อมี session token — ไม่ seed = กระดิ่งไม่เคยถูกทดสอบเลย
  localStorage.setItem('dmj_session_token', 'harness-token');

  // ── stub fetch: ตัด network จริงทั้งหมด → ตอบ fixture/verifyPin ──
  const realFetch = window.fetch;
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    // GAS GET (payload) — ตอบ fixture
    const body = (init && init.body) || '';
    const isVerifyPin = /verifyPin/.test(url) || /verifyPin/.test(String(body));
    if (isVerifyPin) return Promise.resolve(new Response(JSON.stringify({ ok: true }), { headers: { 'Content-Type': 'application/json' } }));
    // POST actions (write) — ตอบ success จำลอง · action ลงเวลาต้องตอบให้ครบ field
    // (views-attendance.jsx อ่าน today.events/rows ตรง ๆ — payload ว่างจะได้แค่หน้าเปล่า ไม่ได้ทดสอบอะไร)
    if (init && init.method === 'POST') {
      let action = '';
      try { action = (JSON.parse(body) || {}).action || ''; } catch (e) {}
      // action=me ต้องตอบรูปแบบจริง {ok:true, staff:{...}} — ตอบ {success:true} เฉย ๆ
      // จะทำให้ checkMe() ลบ dmj_session_token ทิ้งแล้วเด้งไปหน้าล็อกอิน (ของจริงไม่เป็นแบบนั้น)
      // ผลข้างเคียงที่เคยมองไม่เห็น: ทุกอย่างที่ต้องใช้ token (เช่นกระดิ่งแจ้งเตือน) ไม่เคยถูกทดสอบเลย
      if (action === 'me') {
        // ⚠️ staffId ต้องเป็น 'STF001' ให้ตรงกับที่ seed ไว้ข้างบน + assigneeId ใน fixture.js
        // เพราะ applyStaffSession() (app.jsx) **เขียนทับ** window._currentStaffId ด้วยค่าจากตรงนี้
        // ใส่เลขอื่นเมื่อไหร่ MyJobsCard ("งานของฉัน") จะหางานของตัวเองไม่เจอแล้วคืน null เงียบ ๆ
        return Promise.resolve(new Response(JSON.stringify({
          ok: true,
          staff: { staffId: 'STF001', name: 'ทดสอบ ระบบ', role: role, status: 'active', pictureUrl: '' },
        }), { headers: { 'Content-Type': 'application/json' } }));
      }
      // ออกบิล/บันทึกขาย (POS + ขายออนไลน์) — dispatch ด้วยธง createSaleBill ไม่ใช่ data.action
      // ต้องตอบ orderNumber/totals/payTotal ให้ครบเหมือนของจริง ไม่งั้นหน้าสรุปที่ส่งลูกค้า
      // ได้แต่ "—" กับยอด 0 = เทสต์เขียวโดยไม่ได้ทดสอบตัวเลขที่ลูกค้าจะเห็นจริงเลย
      let posted = {};
      try { posted = JSON.parse(body) || {}; } catch (e) {}
      if (posted.createSaleBill) {
        // โหมดจำลอง "GAS เขียนบิลเสร็จแล้วแต่ตอบเป็นหน้า HTML" (execution ซ้อนกัน / ลิงก์ตัดสาย)
        // — เส้นทางที่ res.json() ดิบเคยโยน "Unexpected token '<'" แล้วผู้ขายกดซ้ำ = บิลซ้ำ
        // เปิดด้วย window.__DMJ_SALEBILL_HTML · frontend ต้องถาม action=billCheck ก่อนขึ้นแดง
        if (window.__DMJ_SALEBILL_HTML) {
          window.__DMJ_SALEBILL_POST_COUNT = (window.__DMJ_SALEBILL_POST_COUNT || 0) + 1;
          return Promise.resolve(new Response(
            '<!DOCTYPE html><html><head><title>Error</title></head><body>Service invoked too many times</body></html>',
            { status: 200, headers: { 'Content-Type': 'text/html' } }));
        }
        const shipFee = Math.max(0, Number((posted.shipping || {}).fee) || 0);
        const goods = (posted.items || []).reduce(function (s, it) {
          return s + (Number(it.qty) || 0) * (Number(it.price) || 0);
        }, 0);
        const t = { retailEligible: goods, retailExcluded: 0, grandTotal: goods,
                    vat: goods * 7 / 107, preVat: goods - goods * 7 / 107, savings: 0 };
        return Promise.resolve(new Response(JSON.stringify({ success: true, data: {
          orderId: 9001, orderNumber: 'RC-3-2026080099', documentNumber: null,
          totals: t, shipFee: shipFee, payTotal: goods + shipFee, shipInZort: false,
        } }), { headers: { 'Content-Type': 'application/json' } }));
      }
      const att = window.__DMJ_ATT_FIXTURE || {};
      const data = Object.prototype.hasOwnProperty.call(att, action) ? att[action] : {};
      return Promise.resolve(new Response(JSON.stringify({ success: true, data: data }), { headers: { 'Content-Type': 'application/json' } }));
    }
    // "บิลใบนี้ออกไปแล้วหรือยัง" (action=billCheck) — ต้องมาก่อน branch payload รวม
    // frontend ถามหลัง createSaleBill ตอบ HTML · ค่าจาก window.__DMJ_BILLCHECK
    // (found:true = บิลลงแล้ว → หน้าจอต้องขึ้นสำเร็จ ไม่ใช่แดง · found:false = ยังไม่ลง)
    if (/action=billCheck/.test(url)) {
      return Promise.resolve(new Response(JSON.stringify(window.__DMJ_BILLCHECK ||
        { ok: true, found: false }), { headers: { 'Content-Type': 'application/json' } }));
    }
    // แจ้งเตือนในแอป (กระดิ่ง) — ต้องมาก่อน branch payload รวม ไม่งั้นจะได้ payload สินค้าแทน
    if (/action=inappNoti/.test(url)) {
      return Promise.resolve(new Response(JSON.stringify(window.__DMJ_NOTI_FIXTURE || { ok: true, items: [], unread: 0 }),
        { headers: { 'Content-Type': 'application/json' } }));
    }
    // ⭐ ผู้ดูแลสินค้า — ต้องมาก่อน branch payload รวมเหมือนกระดิ่ง
    // (ตอบ payload สินค้าแทนจะได้ owners={} + off=false โดยบังเอิญ = เทสต์ผ่านแบบไม่ได้ทดสอบจริง)
    if (/action=productOwners/.test(url)) {
      return Promise.resolve(new Response(JSON.stringify(window.__DMJ_OWNER_FIXTURE ||
        { ok: true, owners: {}, me: 'STF001', meName: 'ทดสอบ', off: false }),
        { headers: { 'Content-Type': 'application/json' } }));
    }
    // 🏅 ผลงานพนักงาน — ต้องมาก่อน branch payload รวมเหมือนกระดิ่ง/ดาว
    // (ตอบ payload สินค้าแทนจะได้ d.data undefined → หน้าว่างเปล่าแต่ไม่ crash = เทสต์เขียวลวง)
    if (/action=staffPerf/.test(url)) {
      return Promise.resolve(new Response(JSON.stringify(window.__DMJ_STAFFPERF_FIXTURE ||
        { success: true, data: { month: '2026-08', cats: [], staff: [], unmatched: [] } }),
        { headers: { 'Content-Type': 'application/json' } }));
    }
    // 👥 ลูกค้า & ยอดซื้อ — ต้องมาก่อน branch payload รวมเหมือนกระดิ่ง/ดาว/ผลงานพนักงาน
    // (ตอบ payload สินค้าแทนจะได้ customers=undefined → หน้า "ยังไม่มีข้อมูลลูกค้า" = เทสต์เขียวลวง)
    if (/action=getCustomerAnalytics/.test(url)) {
      return Promise.resolve(new Response(JSON.stringify(window.__DMJ_CUSTOMER_FIXTURE ||
        { customers: [], months: [], grandTotal: 0 }),
        { headers: { 'Content-Type': 'application/json' } }));
    }
    // 📄 ใบเสนอราคา (action=getQuotationSummary) — ต้องมาก่อน branch payload รวม
    // (ตอบ payload สินค้าแทนจะได้ items=undefined → หน้า "ไม่มีใบเสนอราคา" = เทสต์เขียวลวง)
    if (/action=getQuotationSummary/.test(url)) {
      return Promise.resolve(new Response(JSON.stringify(window.__DMJ_QUOTE_FIXTURE ||
        { items: [], salesList: [], statusBreakdown: {}, generatedAt: new Date().toISOString() }),
        { headers: { 'Content-Type': 'application/json' } }));
    }
    // GET payload
    if (/script\.google|exec|action=orders|action=getAuditLog|action=getDeadStock/.test(url) || url.indexOf('http') === 0) {
      // โหมด nodata: ค้างไว้ไม่ตอบเลย (เหมือนเน็ตร้านช้า/ก้อนใหญ่ยังไหลไม่จบ)
      // ต้อง "ไม่ตอบ" ไม่ใช่ "ตอบ error" — เพราะสิ่งที่ทดสอบคือช่วง *ระหว่างรอ*
      // ซึ่งเป็นช่วงที่พนักงานต้องลงเวลาได้ ไม่ใช่ช่วงหลังจากมันล้มเหลวไปแล้ว
      if (NO_DATA) return new Promise(function () {});
      const payload = Object.assign({}, window.__DMJ_PAYLOAD, { lastModified: Date.now() });
      return Promise.resolve(new Response(JSON.stringify(payload), { headers: { 'Content-Type': 'application/json' } }));
    }
    return realFetch ? realFetch(input, init) : Promise.reject(new Error('fetch blocked in harness: ' + url));
  };
  window.__TAB = tab; // ให้ test script รู้ว่าจะ navigate ไป tab ไหน
})();
</script>
<script src="/config.js"></script>

<!-- boot: mirror ของจริง (ui → views-main → views-analytics → views-quote → views-attendance → app)
     แต่ libs local · ลำดับต้องตรงกับ "Doomuenjing Dashboard.html" เป๊ะ ไม่งั้น component หาย
     (เช่น AttendanceView ไม่ถูกประกาศ → ทุก role ที่มีแท็บ "attendance" white-screen) -->
<script>
(function () {
  function injectCode(code) { const s = document.createElement('script'); s.textContent = code; document.head.appendChild(s); }
  async function compileJsx(src) {
    const resp = await fetch(src);
    const text = await resp.text();
    return Babel.transform(text, { presets: ['react'], sourceType: 'script', filename: src }).code;
  }
  // compile ขนานกัน (เร็วกว่า) แต่ inject ตามลำดับเสมอ — global scope เดียวกัน ลำดับสำคัญ
  const ORDER = ['/views-main.jsx', '/views-analytics.jsx', '/views-quote.jsx', '/views-attendance.jsx'];
  // i18n.jsx ต้องก่อน ui.jsx (mirror ของจริง) — ui.jsx ใช้ t()/useLang()/DMJ_LANGS
  compileJsx('/i18n.jsx').then(injectCode)
    .then(() => compileJsx('/ui.jsx')).then(injectCode)
    .then(() => Promise.all(ORDER.map(compileJsx)))
    .then((codes) => { codes.forEach(injectCode); return compileJsx('/app.jsx').then(injectCode); })
    .then(() => { window.__BOOTED = true; })
    .catch((e) => { window.__BOOT_ERR = String(e && e.stack || e); });
}());
</script>
