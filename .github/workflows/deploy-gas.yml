name: Deploy to Google Apps Script

on:
  push:
    branches: [master]
    paths:
      - 'appsscript_complete.gs'
      - 'appsscript.json'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      # clasp push อัปโค้ดเข้า HEAD ของ project — พอ deployment เดิมถูกตั้งเป็น
      # version "Head" แล้ว (ทำครั้งเดียวใน GAS editor: Deploy → Manage deployments →
      # แก้ deployment เดิม → Version = Head) เว็บแอป /exec จะรันโค้ด HEAD เสมอ
      # ไม่ต้อง `clasp deploy` สร้าง version ใหม่อีกต่อไป
      #
      # ⚠️ ห้ามเพิ่ม `clasp deploy` กลับมาโดยไม่ตั้ง Version=Head ก่อน — Apps Script
      # จำกัด version ไว้ที่ 200/project ตลอดอายุโปรเจกต์และ "ลบ version เก่าไม่ได้เลย"
      # (ชนแล้วที่ 200 เมื่อ 2026-07-24 ถึง 2026-07-28 ทำให้ deploy fail ทุกครั้ง 4 วันติด
      # แม้ push จะสำเร็จก็ตาม — โค้ดเข้า editor แต่เว็บแอปจริงยังรันโค้ดเก่า)
      - name: Push to GAS (HEAD deployment — no new version needed)
        run: clasp push --force
