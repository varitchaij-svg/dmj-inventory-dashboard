<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" id="dmj-viewport-meta" />
<script>
  // แก้เฉพาะเครื่องที่ UA รายงานเป็น desktop (X11; Linux x86_64, ไม่มี Android/Mobile)
  // ทั้งที่จริงเป็นจอสัมผัสมือถือ — เจอเคสจริง: WebView แบบนี้ไม่ยึด width=device-width
  // ตามที่ควร ทำให้ทั้งหน้าถูกคำนวณ viewport กว้างเกิน แล้วบีบ (zoom) ลงมาให้พอดีจอ
  // ผลคือทุกอย่างเล็กลงทั้งหน้า (ตัวหนังสือ/ปุ่ม) — แก้โดยบังคับความกว้าง viewport ตาม
  // จอจริง (screen.width) แทน device-width เฉยๆ + ขยาย UI ทั้งหน้าด้วย zoom ให้อ่านง่ายขึ้น
  (function () {
    try {
      var ua = navigator.userAgent || "";
      var looksDesktopUA = /X11;\s*Linux/i.test(ua) && !/Android|Mobile|iPhone|iPad/i.test(ua);
      var isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
      if (looksDesktopUA && isTouch) {
        var w = Math.round(window.screen && window.screen.width || window.innerWidth || 390);
        var vp = document.getElementById("dmj-viewport-meta");
        if (vp) vp.setAttribute("content", "width=" + w + ",initial-scale=1,maximum-scale=1");
        document.documentElement.classList.add("dmj-device-zoomfix");
      }
    } catch (e) {}
  })();
</script>
<title>Doomuenjing · Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f7f44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doomuenjing">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  img, svg, canvas, video, iframe { max-width: 100%; }
  :root {
    /* Greens */
    --g-50:  #f1faf3;
    --g-100: #dcf2e2;
    --g-200: #b9e5c5;
    --g-300: #88d09e;
    --g-400: #4fb472;
    --g-500: #2a9b56;
    --g-600: #1f7f44;  /* PRIMARY */
    --g-700: #196736;
    --g-800: #15522d;
    --g-900: #103e23;
    /* Earth tones */
    --bg:    #f7faf6;
    --paper: #ffffff;
    --bdr:   #e2eadd;
    --bdr-2: #c9d6bf;
    --text:  #18221a;
    --muted: #5b6b5e;
    --light: #94a194;
    /* States */
    --warn:  #c2570a;
    --warn-t:#fef3e7;
    --dang:  #b8341c;
    --dang-t:#fcecea;
    --info:  #1f6f8b;
    --info-t:#e9f4f8;
    --gold:  #a07417;
    /* Radii / shadow */
    --r-sm: 8px;
    --r:    12px;
    --r-lg: 16px;
    --sh-1: 0 1px 2px rgba(15,40,20,.04), 0 1px 1px rgba(15,40,20,.03);
    --sh-2: 0 4px 12px rgba(15,40,20,.06), 0 2px 4px rgba(15,40,20,.04);
    --sh-3: 0 12px 28px rgba(15,40,20,.10), 0 4px 10px rgba(15,40,20,.06);
  }

  html, body { font-family: "IBM Plex Sans Thai","Inter",system-ui,sans-serif; }
  html { overflow-x: hidden; }
  /* เฉพาะเครื่องที่ตรวจพบว่า UA รายงานเป็น desktop ทั้งที่เป็นจอสัมผัส (ดู <script> บนสุดของ head)
     ขยาย UI ทั้งหน้าให้อ่านง่ายขึ้น — zoom เป็น non-standard property แต่ WebView กลุ่มนี้ (Blink/Chrome) รองรับ */
  html.dmj-device-zoomfix { zoom: 1.3; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    max-width: 100vw;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

  /* ---------- App shell ---------- */
  #root {
    min-height: 100vh;
    max-width: 100vw;
    overflow-x: hidden;
  }

  /* Header */
  .topnav {
    background: var(--paper);
    border-bottom: 1px solid var(--bdr);
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(8px);
    overflow-x: hidden;
    max-width: 100vw;
  }
  .topnav-inner {
    max-width: 1480px; margin: 0 auto;
    padding: 14px 28px;
    display: flex; align-items: center; gap: 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--g-500), var(--g-700));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 18px;
    box-shadow: 0 4px 12px rgba(31,127,68,.32);
    font-family: "Inter",sans-serif;
  }
  .brand-text { line-height: 1.1; }
  .brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .navtabs {
    display: flex; gap: 4px; flex: 1;
    margin-left: 12px;
    min-width: 0;
    overflow-x: auto;
  }
  /* owner: แท็บเยอะ (19+) → wrap เต็มความกว้างเป็นหลายแถว เห็นครบไม่ต้องเลื่อนแนวนอน */
  .navtabs-wrap {
    flex-basis: 100%; order: 3;
    flex-wrap: wrap; overflow: visible;
    margin-left: 0; margin-top: 6px;
    row-gap: 4px;
  }
  .navtabs-wrap .navtab { min-height: 38px; padding: 7px 12px; font-size: 13px; }
  .navtab {
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 500;
    color: var(--muted);
    padding: 10px 14px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 7px;
    transition: all .15s;
    min-height: 44px;
  }
  .navtab:hover { color: var(--text); background: var(--g-50); }
  .navtab.active {
    color: var(--g-700); background: var(--g-100); font-weight: 700;
    box-shadow: inset 0 -2px 0 var(--g-600);
  }
  .navtab svg { width: 15px; height: 15px; stroke-width: 2; }

  /* ── Owner nav 2 ชั้น: หมวดหลัก + เมนูย่อย ── */
  .owner-nav {
    flex-basis: 100%; order: 3; margin-top: 8px; min-width: 0;
    display: flex; flex-direction: column; gap: 8px;
  }
  .owner-l1 { display: flex; gap: 6px; flex-wrap: wrap; }
  .owner-grp {
    background: none; border: 1px solid transparent; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 600; color: var(--muted);
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 15px; border-radius: 11px; min-height: 42px;
    transition: background .15s, color .15s;
  }
  .owner-grp:hover { color: var(--text); background: var(--g-50); }
  .owner-grp.active {
    color: var(--g-700); background: var(--g-100); font-weight: 800;
    box-shadow: inset 0 -2px 0 var(--g-600);
  }
  .owner-grp .gi { font-size: 17px; line-height: 1; }
  .owner-grp .gc {
    font-size: 11px; font-weight: 800; min-width: 18px; height: 18px;
    padding: 0 5px; border-radius: 9px; display: inline-grid; place-items: center;
    background: #fbf1dc; color: #9a6a0f;
  }
  .owner-l2 {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding-top: 9px; border-top: 1px solid var(--bdr);
  }
  .owner-sub {
    background: var(--paper); border: 1px solid var(--bdr); cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--text);
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 13px; border-radius: 10px; min-height: 42px;
    transition: border-color .15s, background .15s, color .15s;
  }
  .owner-sub:hover { border-color: var(--g-400); background: var(--g-50); }
  .owner-sub.active {
    border-color: var(--g-600); background: var(--g-100);
    color: var(--g-700); font-weight: 800;
  }
  .owner-sub svg { width: 15px; height: 15px; stroke-width: 2; }
  .owner-sub .sb {
    font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 8px;
    background: #fbf1dc; color: #9a6a0f;
  }

  .nav-right { display: flex; align-items: center; gap: 10px; }
  .nav-status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted);
    background: var(--g-50); border: 1px solid var(--bdr);
    padding: 5px 11px; border-radius: 999px;
  }
  .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--g-500);
    box-shadow: 0 0 0 3px rgba(42,155,86,.18); }

  /* Main area */
  .main {
    max-width: 1480px; margin: 0 auto;
    padding: 28px;
    overflow-x: hidden; /* prevent horizontal overflow from cards/grid */
    width: 100%;
    box-sizing: border-box;
  }

  /* Page header */
  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 22px; gap: 16px; flex-wrap: wrap;
  }
  .page-title { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
  .page-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .page-actions { display: flex; gap: 10px; align-items: center; }

  /* ── OverviewView: ปุ่มลอย (FAB) + modal ตัวกรอง/ไปที่หัวข้อ ─────────────────────
       เคยลองทั้ง sticky bar เต็มความกว้าง และการ์ดลอยชิดขอบซ้ายมาก่อน — ทั้งคู่ยังต้อง
       คำนวณความสูง topnav + จัดวางแบบ fixed ใต้ nav ซึ่งพัง/บังเนื้อหาต่างกันไปเวลา
       สลับมือถือแนวตั้ง (จอสูงแคบ) ↔ แนวนอน (จอเตี้ยกว้าง) ↔ iPad (จอใหญ่)
       → เปลี่ยนมาใช้ FAB มุมล่างขวา (ตำแหน่งเดียวกันทุกขนาดจอ ไม่ต้องคำนวณอะไร)
       เปิด modal กลางจอ (fixed inset:0 + card กลาง + max-height + scroll ภายใน)
       ซึ่งเป็น pattern เดียวกับ modal อื่นในแอป (ดู ProductModal) ที่ทนทุก orientation
       อยู่แล้วเพราะไม่ผูกกับตำแหน่ง/ความสูงของ nav เลย ── */
  .ov-fab {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 45; font-family: inherit; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 12px 18px; border-radius: 99px; font-size: 13px; font-weight: 700;
    background: #1b5e20; color: #fff; border: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
    max-width: calc(100vw - 32px);
  }
  .ov-fab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 380px) { .ov-fab-label { max-width: 38vw; } }

  .ov-modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(20,30,20,.5); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    box-sizing: border-box;
  }
  .ov-modal-card {
    background: var(--paper); border-radius: 16px; width: 100%; max-width: 560px;
    max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3);
    box-sizing: border-box;
  }
  .ov-modal-header {
    position: sticky; top: 0; z-index: 1; background: var(--paper);
    padding: 16px 18px; border-bottom: 1px solid var(--bdr);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 800; color: var(--text);
  }
  .ov-modal-close {
    border: 1px solid var(--bdr); background: #fff; border-radius: 10px;
    width: 40px; height: 40px; cursor: pointer; font-size: 20px; color: var(--muted);
    font-family: inherit; flex-shrink: 0;
  }
  .ov-modal-body { padding: 14px 18px 22px; }
  .ov-modal-body .ov-filterbar { margin: 0 0 16px; }
  .ov-modal-section-title {
    font-size: 12px; font-weight: 700; color: var(--muted);
    margin: 4px 0 8px; padding-top: 12px; border-top: 1px solid var(--bdr);
  }
  .ov-jumplist { display: flex; flex-direction: column; gap: 6px; }
  .ov-jumplist-item {
    font-family: inherit; cursor: pointer; text-align: left; white-space: nowrap;
    padding: 12px 14px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
    border: 1px solid var(--bdr); background: var(--g-50); color: var(--g-700);
    min-height: 44px; overflow: hidden; text-overflow: ellipsis;
  }
  .ov-jumplist-item:active { background: var(--g-100, var(--g-50)); }
  .btn {
    font-family: inherit; cursor: pointer;
    font-size: 13px; font-weight: 600;
    padding: 8px 16px; border-radius: 10px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .12s;
    border: 1px solid var(--bdr);
    background: var(--paper);
    color: var(--text);
  }
  .btn:hover { background: var(--g-50); border-color: var(--bdr-2); }
  .btn.primary {
    background: var(--g-600); color: #fff; border-color: var(--g-600);
    box-shadow: 0 2px 6px rgba(31,127,68,.25);
  }
  .btn.primary:hover { background: var(--g-700); border-color: var(--g-700); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); background: var(--g-50); }
  .btn svg { width: 14px; height: 14px; stroke-width: 2.2; }

  /* Time range */
  .seg {
    display: inline-flex; background: var(--paper);
    border: 1px solid var(--bdr); border-radius: 10px; padding: 3px;
  }
  .seg-btn {
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 12.5px; font-weight: 500;
    padding: 8px 14px; border-radius: 7px; color: var(--muted);
    transition: all .12s; min-height: 40px;
  }
  .seg-btn:hover { color: var(--text); background: var(--g-50); }
  .seg-btn.active { background: var(--g-600); color: #fff; font-weight: 700; box-shadow: 0 1px 4px rgba(31,127,68,.3); }

  /* Cards */
  .card {
    background: var(--paper);
    border: 1px solid var(--bdr);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-1);
    padding: 20px;
  }
  .card.hover:hover { box-shadow: var(--sh-2); border-color: var(--bdr-2); }
  .card-title { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  .card-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .card-head { margin-bottom: 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

  /* Category page layout */
  .cat-layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 20px;
    min-width: 0;
    width: 100%;
    box-sizing: border-box;
  }
  .cat-layout > * { min-width: 0; }
  .cat-sidebar { align-self: start; position: sticky; top: 80px; }

  /* Product grid — mobile-first: 2 cols default, expand on larger screens */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
  }
  .product-grid > * { min-width: 0; }
  @media (min-width: 900px) {
    .product-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  }

  /* Grid utilities */
  .row { display: grid; gap: 16px; }
  .row-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .row-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .row-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .row-12-5 { grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); }
  @media (max-width: 1280px) {
    .row-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  /* ── Tablet landscape + small laptop (iPad Pro 12.9" landscape = 1366px, iPad Pro 11" = 1194px) ── */
  @media (max-width: 1200px) {
    .topnav-inner { padding: 12px 20px; gap: 16px; }
    .main { padding: 20px; }
  }
  @media (max-width: 1100px) {
    .row-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row-3 { grid-template-columns: minmax(0, 1fr); }
    .row-12-5 { grid-template-columns: minmax(0, 1fr); }
  }
  /* ── iPad landscape (1024px) — nav starts getting cramped ── */
  @media (max-width: 1024px) {
    .topnav-inner { flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
    .navtabs { order: 3; flex-basis: 100%; overflow-x: auto;
      gap: 2px; padding-bottom: 4px; scrollbar-width: thin; }
    .navtabs::-webkit-scrollbar { height: 4px; }
    .navtab { padding: 7px 11px; font-size: 13px; flex-shrink: 0; }
    .navtab span { white-space: nowrap; }
    /* owner 2 ชั้น: เลื่อนแนวนอนแทนตกบรรทัด — กดง่าย ไม่กินพื้นที่แนวตั้ง */
    .owner-l1, .owner-l2 {
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin;
      padding-bottom: 4px; -webkit-overflow-scrolling: touch;
    }
    .owner-l1::-webkit-scrollbar, .owner-l2::-webkit-scrollbar { height: 4px; }
    .owner-grp, .owner-sub { flex-shrink: 0; white-space: nowrap; }
    .main { padding: 16px; }
    .cat-layout { grid-template-columns: 200px 1fr; }
  }
  @media (max-width: 900px) {
    .cat-layout { grid-template-columns: 1fr; }
    .cat-sidebar { display: none !important; }
    .cat-layout { gap: 12px; }
  }
  @media (max-width: 640px) {
    .cat-layout { grid-template-columns: 1fr !important; }
  }
  /* ── iPad portrait (768px) ── */
  @media (max-width: 768px) {
    .row-2 { grid-template-columns: 1fr; }
    .main { padding: 14px; }
    .cat-layout { grid-template-columns: 1fr; }
    .cat-sidebar { position: static !important; }
    .page-title { font-size: 22px; }
    .card { padding: 16px; border-radius: var(--r); }
    .kpi { padding: 14px 16px; }
    .kpi-value { font-size: 26px; }
    .sec-head { margin: 20px 0 12px; }
  }
  /* ── Large phones / small tablets (720px) ── */
  @media (max-width: 720px) {
    .row-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .topnav-inner { padding: 8px 12px; }
    .navtab { padding: 7px 10px; font-size: 12.5px; }
    .nav-status { display: none; }
    .brand-sub { display: none; }
    .page-title { font-size: 20px; }
    .page-head { margin-bottom: 14px; }
    .kpi-value { font-size: 24px; }
    .kpi-deco { width: 60px; height: 60px; }
    .kpi-icon { top: 12px; right: 12px; width: 26px; height: 26px; }
    table.t { font-size: 12px; }
    table.t th, table.t td { padding: 8px 6px; }
    table.t th { font-size: 10px; }
    .sec-head { margin: 20px 0 10px; }
  }
  @media (max-width: 480px) {
    .row-4 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } /* Keep 2x2 KPIs on phones */
    .row-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .main { padding: 10px; }
    .topnav-inner { padding: 8px 10px; }
    .brand-mark { width: 32px; height: 32px; font-size: 15px; }
    .brand-name { font-size: 14px; }
    .page-title { font-size: 18px; }

    /* Controls card — more compact (exclude product cards with .hover class) */
    .cat-layout .card:not(.hover) { padding: 12px !important; }

    /* Filter bar labels — hide, just show emoji/chips */
    .filter-bar-label { display: none !important; }

    /* Filter bar — reduce spacing */
    .filter-bar { margin-top: 8px !important; padding-top: 8px !important; gap: 6px !important; }
    .filter-chips { gap: 4px !important; }
    .fchip { font-size: 11px !important; padding: 4px 8px !important; }

    /* Search + sort controls — stack vertically */
    .cat-layout .card > div:first-child { flex-direction: column !important; gap: 8px !important; }
    .cat-layout .card > div:first-child > div { flex: 1 !important; min-width: 0 !important; width: 100% !important; }
    .cat-layout .card > div:first-child > div select { width: 100% !important; }

    /* OrderItemRow — tighter +/- buttons on small phones */
    .order-adj-btn { width: 38px !important; height: 38px !important; font-size: 15px !important; }
    .order-adj-input { width: 44px !important; font-size: 14px !important; }

    /* Action buttons in order row — smaller */
    .order-action-btn { width: 38px !important; height: 38px !important; }

    /* QR scan modal — bottom sheet */
    .qr-scan-modal-inner {

      position: fixed !important; bottom: 0 !important;

    }

    /* LabelPrint — controls stack vertically */

    /* Input fields — full width on small screens */

      font-size: 16px !important; /* Prevent zoom on iOS */
    }

    /* Stock/Transfer view — compact search + filters */

      padding: 12px !important;

    /* Table wrappers — reduce padding */
    .t-transfer-wrap, .t-stock-wrap {

    /* Compact label print controls */
    [data-screen-label="labels"] .card > div { flex-direction: column !important; gap: 8px !important; }
    [data-screen-label="labels"] .card input,
    [data-screen-label="labels"] .card button {
      width: 100% !important;
    }

    /* Universal mobile optimization for all views — exclude product cards */
    .card:not(.hover) { padding: 12px !important; border-radius: var(--r) !important; }
    .card.hover { border-radius: var(--r) !important; }
    .card-head { padding: 0 0 8px 0 !important; gap: 8px !important; }
    .card-title { font-size: 15px !important; }
    .page-actions { width: 100% !important; }
    .page-actions button { width: 100% !important; }

    /* Stack horizontal flexbox sections */
    [role="tablist"] { gap: 2px !important; padding: 0 !important; }

    /* Compact KPI layout */
    .kpi { padding: 12px 14px !important; }
    .kpi-value { font-size: 20px !important; }
    .kpi-label { font-size: 10px !important; }

    /* Stock view — better table view */
    [data-screen-label="stock"] .page-head { flex-direction: column !important; align-items: flex-start !important; }
    [data-screen-label="stock"] .page-actions { width: 100% !important; }

    /* Order views — better layout */
    [data-screen-label="orders"] .page-head { flex-direction: column !important; }
    [data-screen-label="ordersummary"] .page-head { flex-direction: column !important; }

    /* Trends view — responsive cards */
    [data-screen-label="trends"] .trends-grid { gap: 8px !important; }
    [data-screen-label="trends"] .card { padding: 10px !important; }

    /* All buttons — touch-friendly minimum height */
    .btn { min-height: 44px !important; padding: 10px 14px !important; font-size: 13px !important; }
    select { min-height: 44px !important; padding: 8px 10px !important; }

    /* Reduce overall spacing */
    .page-head { margin-bottom: 12px !important; }
    .sec-head { margin: 14px 0 10px !important; }
  }

  /* ── Mobile 640px — product cards + pill buttons ── */
  @media (max-width: 640px) {
    .cat-layout { gap: 12px; }
    /* Compact KPI on mobile — fit 4 KPIs nicely */
    .kpi { padding: 10px 12px !important; }
    .kpi-value { font-size: 18px !important; }
    .kpi-label { font-size: 9.5px !important; letter-spacing: .04em !important; }
    .kpi-foot { font-size: 10px !important; margin-top: 2px !important; }
    .kpi-deco { width: 48px !important; height: 48px !important; top: -16px !important; right: -16px !important; }
    .kpi-icon { width: 22px !important; height: 22px !important; top: 8px !important; right: 8px !important; }
    .kpi-icon svg { width: 12px !important; height: 12px !important; }

    /* Tighter page head spacing */
    .page-head { margin-bottom: 10px !important; flex-wrap: wrap; }
    .page-sub { font-size: 11px !important; }

    .product-grid .pcard-img { padding: 6px !important; } /* image wrapper */
    .product-grid .pcard-img .pimg { padding: 0 !important; } /* placeholder inside wrapper */
    .product-grid .skucode { font-size: 9px !important; padding: 1px 5px !important; }
    .product-grid .pcard-body { padding: 6px 10px 8px !important; }
    .product-grid .pcard-order { padding: 0 10px 10px !important; }
    /* Vendor line — keep visible on mobile (owner orders by supplier), compact */
    .product-grid .vendor-line { font-size: 9.5px !important; margin-bottom: 2px !important; }

    /* Tighter section header */
    .sec-head { margin: 4px 0 10px !important; flex-wrap: wrap; gap: 8px; }
    .sec-title { font-size: 13.5px !important; }
    .sec-sub { font-size: 10.5px !important; }

    /* Tighten control card (search + sort) — exclude product cards */
    .cat-layout > div > .card:not(.hover) { padding: 10px 12px !important; }
  }

  /* ── Orders tabs — mobile ── */
  @media (max-width: 640px) {
    .order-item-row { border-radius: 10px !important; }
    .order-summary-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 10px !important;
    }
    [data-screen-label="orders"] .page-head,
    [data-screen-label="ordersummary"] .page-head {
      flex-direction: column; align-items: flex-start; gap: 10px;
    }
    [data-screen-label="orders"] .page-head .seg,
    [data-screen-label="ordersummary"] .page-head .seg { width: 100%; }
    [data-screen-label="orders"] .seg-btn,
    [data-screen-label="ordersummary"] .seg-btn { flex: 1; text-align: center; }
  }
  /* ── Orders tabs — tablet (768px–1024px) ── */
  @media (max-width: 1024px) and (min-width: 641px) {
    .order-summary-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
  }

  /* ── QR Scan modal — full width on phone ── */
  @media (max-width: 480px) {
    .qr-scan-modal-inner {
      max-width: 100% !important;
      border-radius: 12px 12px 0 0 !important;
      position: fixed !important;
      bottom: 0 !important; left: 0 !important; right: 0 !important;
      margin: 0 !important;
    }
  }

  /* ── Scrollable table wrapper (TransferView, StockView, etc.) ── */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* Stock table — hide non-essential columns on mobile */
  @media (max-width: 640px) {
    .t-stock th:nth-child(3),
    .t-stock td:nth-child(3),
    .t-stock th:nth-child(4),
    .t-stock td:nth-child(4),
    .t-stock th:nth-child(6),
    .t-stock td:nth-child(6),
    .t-stock th:nth-child(7),
    .t-stock td:nth-child(7),
    .t-stock th:nth-child(8),
    .t-stock td:nth-child(8) { display: none; }

    /* Trends cards: 2 per row on iPhone */
    .trends-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
    .trends-grid .card { font-size: 11px; }

    /* Transfer/order tables: scroll horizontally */
    .t-transfer-wrap, .t-order-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .t-transfer-wrap table, .t-order-wrap table { min-width: 560px; }

    /* Touch-friendly tap targets */
    .btn { min-height: 44px; }
    .seg-btn { min-height: 38px; padding: 6px 14px; }
    .fchip { min-height: 36px; }
  }

  /* ── Filter bar (shared across views) ── */
  .filter-bar {
    display: flex; align-items: center; gap: 6px;
    flex-wrap: wrap; margin-bottom: 12px;
  }
  .filter-bar-label {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em;
    white-space: nowrap; flex-shrink: 0;
  }
  .filter-chips {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .fchip {
    padding: 8px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 600;
    border: 1.5px solid var(--bdr); background: var(--paper); color: var(--muted);
    cursor: pointer; font-family: inherit; transition: all .15s; white-space: nowrap;
    min-height: 44px; display: inline-flex; align-items: center; gap: 4px;
  }
  .fchip:hover { border-color: var(--g-400); color: var(--text); background: var(--g-50); }
  .fchip.active {
    background: var(--g-600); border-color: var(--g-600); color: #fff;
    box-shadow: 0 2px 6px rgba(31,127,68,.25);
  }
  .fchip.active-color { font-weight: 700; }

  @media (max-width: 640px) {
    .filter-bar { flex-wrap: wrap; gap: 6px; }
    .filter-chips { flex-wrap: wrap; gap: 6px; }
    .fchip { font-size: 12px; padding: 8px 12px; min-height: 44px; }
  }

  /* ── OverviewView: ตัวกรอง หมวด/ปี/เดือน แบบ "ปุ่มกดครบทุกตัว ตกบรรทัดเอง" ──────
       เลิกใช้ <select> ทั้งหมด — บน iOS มันเป็น native control ที่มีกรอบ/เงาของตัวเอง
       ดูลอยแยกจาก UI อื่นเสมอ แก้ด้วย CSS ไม่หายขาด และผู้ใช้ต้องกด 2 ครั้ง
       (เปิด dropdown → เลือก) กว่าจะเห็นว่ามีตัวเลือกอะไรบ้าง
       เคยลองเป็นแถวเลื่อนแนวนอนมาก่อน แต่ใช้ยากพอๆ กันข้ามอุปกรณ์ — จอแคบ (มือถือ
       แนวตั้ง) เห็นได้ทีละนิด, จอกว้าง/เตี้ย (แนวนอน, iPad) ไม่มี indicator บอกว่ายัง
       เลื่อนได้อีก คนไม่ถนัดเทคโนโลยีจะไม่รู้ว่ามีตัวเลือกซ่อนอยู่ด้านขวา
       → เปลี่ยนเป็น "ตกบรรทัดเอง" (flex-wrap) เห็นทุกตัวเลือกพร้อมกันเสมอ ไม่ว่าจอ
       จะกว้าง/แคบ/สูง/เตี้ยแค่ไหน ── */
  .ov-filterbar {
    background: var(--paper); border: 1.5px solid var(--bdr); border-radius: 14px;
    padding: 8px 10px; box-sizing: border-box; margin-bottom: 10px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .ov-pillrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
  .ov-pillrow-label {
    flex: 0 0 auto; font-size: 11.5px; font-weight: 700;
    color: var(--muted); white-space: nowrap;
  }
  .ov-pillrow-hint { flex: 0 0 auto; font-size: 11px; color: #b26a00; white-space: nowrap; }
  .ov-pillrow-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .ov-pill {
    font-family: inherit; cursor: pointer; white-space: nowrap;
    padding: 8px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 600;
    border: 1.5px solid var(--bdr); background: var(--paper); color: var(--g-700);
    min-height: 38px; transition: background .15s, color .15s, border-color .15s;
  }
  .ov-pill:hover { border-color: var(--g-400); background: var(--g-50); }
  .ov-pill.on {
    background: #1b5e20; border-color: #1b5e20; color: #fff; font-weight: 700;
    box-shadow: 0 2px 6px rgba(31,127,68,.25);
  }
  .ov-pill.disabled {
    opacity: .4; cursor: not-allowed; color: var(--muted);
  }
  .ov-pill.disabled:hover { background: var(--paper); border-color: var(--bdr); }
  .ov-chevron { font-size: 10px; opacity: .8; }
  /* หมวด: ลิสต์ที่กางลงมาเมื่อกดปุ่ม "🏷️ ทุกหมวด ▾" — เยื้องเข้ามาให้เห็นว่าเป็นลูกของปุ่มด้านบน */
  .ov-catlist {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin: 8px 0 0; padding: 8px 0 0 4px; border-top: 1px dashed var(--bdr);
  }
  @media (max-width: 480px) {
    .ov-filterbar { padding: 8px; border-radius: 12px; }
    .ov-pill { padding: 7px 12px; font-size: 12px; min-height: 40px; }
  }

  /* KPI Card */
  .kpi {
    background: var(--paper);
    border: 1px solid var(--bdr);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-1);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
    transition: all .15s;
  }
  .kpi:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
  .kpi-label { font-size: 11.5px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .07em; }
  .kpi-value {
    font-family: "Inter", sans-serif;
    font-size: 30px; font-weight: 800;
    letter-spacing: -.025em;
    margin: 8px 0 2px;
    line-height: 1.1;
  }
  .kpi-value.green { color: var(--g-700); }
  .kpi-foot {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--muted); margin-top: 4px;
  }
  .kpi-delta {
    font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 6px;
  }
  .kpi-delta.up { background: var(--g-100); color: var(--g-700); }
  .kpi-delta.down { background: var(--dang-t); color: var(--dang); }
  .kpi-deco {
    position: absolute; top: -20px; right: -20px;
    width: 90px; height: 90px; border-radius: 50%;
    background: var(--g-50); opacity: .8;
  }
  .kpi-icon {
    position: absolute; top: 16px; right: 18px;
    width: 30px; height: 30px;
    color: var(--g-500);
    background: var(--g-50);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .kpi-icon svg { width: 16px; height: 16px; stroke-width: 2; }

  /* Chips / badges */
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px;
    background: var(--g-50); color: var(--g-700);
    border: 1px solid var(--g-100);
  }
  .chip.warn { background: var(--warn-t); color: var(--warn); border-color: #f5dec0; }
  .chip.dang { background: var(--dang-t); color: var(--dang); border-color: #f3c8c2; }
  .chip.info { background: var(--info-t); color: var(--info); border-color: #c8e0e9; }
  .chip.neutral { background: #f3f5f0; color: var(--muted); border-color: var(--bdr); }

  /* Category color dot */
  .cat-dot { display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; vertical-align: middle; margin-right: 6px; }

  /* Tables */
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t th { text-align: left; font-weight: 700; font-size: 11px;
    color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
    padding: 10px 10px; border-bottom: 2px solid var(--bdr); background: #fafcf7;
  }
  table.t td { padding: 12px 10px; border-bottom: 1px solid var(--bdr); vertical-align: middle; }
  table.t tr:last-child td { border-bottom: none; }
  table.t tr:hover td { background: var(--g-50); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .skucode {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; font-weight: 600;
    color: var(--g-700); background: var(--g-50);
    padding: 2px 7px; border-radius: 5px;
    border: 1px solid var(--g-100);
    white-space: nowrap;
  }

  /* Product image placeholder */
  .pimg {
    width: 100%; aspect-ratio: 1/1;
    background:
      repeating-linear-gradient(135deg, #ffffff 0 6px, #f1f5ec 6px 12px);
    border-radius: 10px;
    border: 1px solid var(--bdr);
    color: var(--light);
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    position: relative;
  }
  .pimg::after {
    content: ""; position: absolute; top:0; left:0; right:0; bottom:0;
    background: radial-gradient(circle at 30% 30%, transparent 40%, rgba(31,127,68,.06));
    pointer-events: none;
  }

  /* Skeleton + loading */
  .loading-screen {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
  }
  .spin {
    width: 36px; height: 36px;
    border: 3px solid var(--g-100); border-top-color: var(--g-600);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tweaks panel anchor */
  .tweaks-anchor { position: fixed; bottom: 20px; right: 20px; z-index: 100; }

  /* Section header */
  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 28px 0 14px; gap: 16px; flex-wrap: wrap;
  }
  .sec-title { font-size: 16px; font-weight: 700; letter-spacing: -.015em; }
  .sec-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Empty state */
  .empty {
    text-align: center; padding: 52px 24px;
    color: var(--muted); font-size: 13px; line-height: 1.6;
  }
  .empty-ico {
    width: 64px; height: 64px; margin: 0 auto 16px;
    background: var(--g-50); border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    color: var(--g-500);
    box-shadow: 0 2px 8px rgba(31,127,68,.10);
  }

  /* Upload */
  .upload-zone {
    border: 2px dashed var(--bdr-2);
    border-radius: var(--r-lg);
    padding: 36px 24px;
    text-align: center;
    background: var(--paper);
    cursor: pointer;
    transition: all .15s;
  }
  .upload-zone:hover, .upload-zone.over {
    border-color: var(--g-500); background: var(--g-50);
  }
  .upload-zone.done { border-style: solid; border-color: var(--g-500); background: var(--g-50); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bdr-2); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* Recharts tweaks */
  .recharts-default-tooltip {
    background: #fff !important;
    border: 1px solid var(--bdr) !important;
    border-radius: 10px !important;
    box-shadow: var(--sh-2) !important;
    padding: 10px 13px !important;
    font-family: inherit !important;
    font-size: 12px !important;
  }
  .recharts-tooltip-label { font-weight: 700 !important; margin-bottom: 4px !important; }

  /* ── Label Print ── */
  .label-page {
    width: 210mm;
    height: 297mm;
    box-sizing: border-box;
    overflow: hidden;
  }
  .label-page:not(:last-child) {
    page-break-after: always;
    break-after: page;
  }
  .label-page:last-child {
    page-break-after: avoid;
    break-after: avoid;
  }
  .label-grid {
    display: grid;
    grid-template-columns: repeat(5, 42mm);
    grid-template-rows: repeat(14, 21.214mm);
    gap: 0;
  }
  .label-cell {
    width: 42mm;
    height: 21.214mm;
    border: 0.4pt dashed #aaa;
    box-sizing: border-box;
    padding: 0.8mm 1.5mm 0.6mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .label-top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
    flex-shrink: 0;
    margin-bottom: 0.3mm;
    gap: 1mm;
  }
  .label-name {
    flex: 1;
    min-width: 0;
    font-size: 6pt;
    font-weight: 600;
    font-family: 'Kanit', 'IBM Plex Sans Thai', sans-serif;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    line-clamp: 2;
    word-break: break-word;
    overflow-wrap: anywhere;
    color: #111;
    line-height: 1.2;
    letter-spacing: 0;
  }
  .label-price {
    font-size: 7pt;
    font-weight: 700;
    font-family: 'Kanit', 'Inter', sans-serif;
    white-space: nowrap;
    color: #111;
    line-height: 1.2;
    letter-spacing: 0;
    flex-shrink: 0;
  }
  .label-mid-row {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: space-between;
    gap: 1mm;
    min-height: 0;
    position: relative;
  }
  .label-qr-center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .label-qr-center > div,
  .label-qr-center canvas,
  .label-qr-center img { display: block !important; }
  .label-logo-corner {
    position: absolute;
    right: 0.5mm;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 8mm;
    height: 8mm;
  }
  .label-logo-corner img {
    max-width: 100%;
    max-height: 100%;

<!-- ════════════════════════════════════════════════════════════════════
     PERF: เริ่มโหลด "ข้อมูล" + "ไฟล์ JSX" ทันทีตั้งแต่ต้นหน้า
     ════════════════════════════════════════════════════════════════════
     เดิมทุกอย่างต่อคิวกัน: โหลด Babel 3MB → โหลด+compile JSX 1.1MB →
     React mount → ค่อยยิงขอข้อมูลจาก GAS (~7 วิ) = ผู้ใช้รอยาวมากตอนเข้าครั้งแรก
     ทั้งที่การขอข้อมูลไม่ต้องรอ Babel เลย · ยิงตั้งแต่ตรงนี้ทำให้เวลา GAS
     เดินขนานไปกับการโหลด/compile แทนที่จะต่อคิว
     ทุกอย่างห่อ try/catch + ล้มเหลวแล้วคืน null → ฝั่งแอปยิงเองตามปกติ ไม่พัง
-->
<script>
(function () {
  'use strict';

  /* (1) ข้อมูลจาก GAS — ตัวที่กินเวลานานสุดในเส้นทาง เริ่มก่อนเลย
         ทำเป็นฟังก์ชัน idempotent (เรียกซ้ำได้ ไม่ยิงซ้ำ) เพราะมี 2 จังหวะที่ต้องเรียก:
         (ก) ตอนโหลดหน้า ถ้ามี role ค้างจากรอบก่อน (refresh หน้าโดยไม่ปิดแท็บ)
         (ข) ตอนผู้ใช้ "กดเลือกตำแหน่ง" ที่หน้า login — เรียกจาก app.jsx (LoginScreen)
         ต้องมีจังหวะ (ข) ด้วย เพราะ sessionStorage หายทุกครั้งที่ปิดแอป/ปิดแท็บ
         (โดยเฉพาะ PWA มือถือที่พนักงานเปิด-ปิดทุกกะ) → แทบทุกครั้งที่เปิดแอปจริง
         จะไม่มี role ค้างเลย ถ้าไม่เรียกตอนกดเลือกตำแหน่งด้วย prefetch จะไม่ทำงาน
         แทบทุกครั้ง (ตรงตามที่ผู้ใช้แจ้ง: "กดเลือกตำแหน่งแล้วโหลดนาน")
         payload ผูกกับ role แล้ว (GAS ตัดก้อนที่ role นั้นไม่มีแท็บให้เปิดออก) — แต่ทั้งสอง
         จังหวะข้างบนรู้ role อยู่แล้วทั้งคู่ ((ก) อ่านจาก sessionStorage, (ข) เพิ่งกดเลือก)
         จึงยังยิงได้เร็วเท่าเดิม ให้เวลา GAS ซ้อนทับกับเวลาที่ผู้ใช้พิมพ์/ยืนยัน PIN
         ⚠️ ถ้า role ยังไม่รู้จริง ๆ จะไม่ส่ง role ไป → GAS คืน payload เต็ม (ปลอดภัย ไม่ขาด) */
  window._prefetchData = function (roleHint) {
    try {
      if (window._dataPrefetch) return; // กันยิงซ้ำถ้าเรียกซ้ำ
      if (typeof _SHEET_URL !== 'string' || !_SHEET_URL) return;
      var role = roleHint || '';
      if (!role) { try { role = sessionStorage.getItem('dmj_role') || ''; } catch (_) {} }
      var u = _SHEET_URL + (_SHEET_URL.indexOf('?') >= 0 ? '&' : '?')
            + '_t=' + Date.now() + '&fresh=1'
            + '&pv=2&role=' + encodeURIComponent(role);
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      var to  = setTimeout(function () { try { ctl && ctl.abort(); } catch (_) {} }, 35000);
      /* จำ role ที่ใช้ยิงไว้ด้วย — payload ผูกกับ role แล้ว ถ้าสุดท้ายผู้ใช้ล็อกอินเป็น role อื่น
         (เช่น LINE login คืนตำแหน่งจริงจาก server ไม่ตรงกับที่ค้างใน sessionStorage)
         ผลที่ prefetch ไว้จะ "ขาดก้อนข้อมูล" สำหรับ role ใหม่ → app.jsx ต้องทิ้งแล้วยิงใหม่ */
      window._dataPrefetchRole = role;
      window._dataPrefetch = fetch(u, ctl ? { signal: ctl.signal } : undefined)
        .then(function (r) { clearTimeout(to); return r.json(); })
        .catch(function () { clearTimeout(to); return null; });  /* พังก็ไม่เป็นไร แอปยิงเอง */
    } catch (_) {}
  };
  try {
    if (sessionStorage.getItem('dmj_role')) window._prefetchData();
  } catch (_) {}

  /* (2) ไฟล์ JSX ทั้ง 4 — เดิมโหลดต่อกันทีละไฟล์ (ui → views → app)
         ยิงพร้อมกันตั้งแต่ตอนนี้ พอ Babel พร้อมก็ compile ได้เลยไม่ต้องรอ network */
  try {
    window._jsxPre = {};
    ['ui.jsx', 'views-main.jsx', 'views-analytics.jsx', 'views-quote.jsx', 'views-attendance.jsx', 'app.jsx'].forEach(function (s) {
      try { window._jsxPre[s] = fetch(s); } catch (_) {}
    });
  } catch (_) {}
}());
</script>

<body>
  <div id="root">

  <!-- React + Recharts + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>

  <script defer src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- html2canvas: self-host (same-origin) — ใช้พิมพ์ใบเสร็จตรงผ่าน Bluetooth (rasterize DOM → ESC/POS)
       เดิมโหลดจาก CDN แต่ไม่เสถียรบน iPad/เน็ตร้าน (โหลดไม่ทัน → พิมพ์ Bluetooth พัง) → เก็บไฟล์เองใน repo
       fallback CDN ถ้าไฟล์ local หาย -->
  <script defer src="/html2canvas.min.js" onerror="var s=document.createElement('script');s.defer=true;s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';document.head.appendChild(s);"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
(function () {
  'use strict';

  /* ฉีด compiled JS เข้า global scope */
  function injectCode(code) {
    var s = document.createElement('script');
    s.textContent = code;
    document.head.appendChild(s);
  }

  var BC = 'dmj-babel-v2'; // bump เมื่อ format เปลี่ยน

  /* fetch + cache check + compile → คืน code string (ไม่ inject)
     แยกออกมาเพื่อให้ views-main + views-analytics compile พร้อมกันได้ */
  async function compileJsx(src) {
    /* ใช้ response ที่เริ่มโหลดไว้ตั้งแต่ต้นหน้า (ดู script ใน <head>) ถ้ามี
       เคลียร์ทิ้งหลังหยิบ เพราะ body ของ Response อ่านได้ครั้งเดียว */
    var pre = null;
    try {
      if (window._jsxPre && window._jsxPre[src]) {
        pre = window._jsxPre[src];
        window._jsxPre[src] = null;
      }
    } catch (_) {}
    var resp = await (pre || fetch(src));
    /* ETag หรือ Last-Modified จาก Cloudflare — อ่านได้โดยไม่ต้องอ่าน body */
    var etag = resp.headers.get('etag') || resp.headers.get('last-modified') || '';

    /* ── Cache API: ไม่มี size limit, ออกแบบสำหรับไฟล์ใหญ่ ── */
    if (etag && typeof caches !== 'undefined') {
      try {
        var bc = await caches.open(BC);
        var hit = await bc.match(src + '.compiled');
        if (hit && hit.headers.get('x-etag') === etag) {
          return await hit.text(); /* cache hit — ไม่ต้องอ่าน body หรือ compile เลย */
        }
      } catch (_) {}
    }

    /* ── Cache miss: อ่าน body แล้ว compile ── */
    var text = await resp.text();
    var compiled = Babel.transform(text, {
      presets: ['react'],
      sourceType: 'script',
      filename: src,
    }).code;

    /* บันทึก compiled code ไว้ใช้ครั้งหน้า */
    if (typeof caches !== 'undefined') {
      try {
        var bc = await caches.open(BC);
        await bc.put(src + '.compiled', new Response(compiled, {
          headers: { 'Content-Type': 'application/javascript', 'x-etag': etag }
        }));
      } catch (_) {}
    }

    return compiled;
  }

  function loadJsx(src) {
    return compileJsx(src).then(function (code) { injectCode(code); });
  }

  /* โหลด ui ก่อน จากนั้น compile views-main + views-analytics + views-quote พร้อมกัน
     แล้ว inject ตามลำดับ (views-main ก่อนเสมอ, views-quote ใช้ component จากทั้งคู่) */
  window._appBoot = loadJsx('ui.jsx')
    .then(function () {
      return Promise.all([compileJsx('views-main.jsx'), compileJsx('views-analytics.jsx'), compileJsx('views-quote.jsx'), compileJsx('views-attendance.jsx')]);
    })
    .then(function (codes) {
      injectCode(codes[0]); /* views-main ก่อน */
      injectCode(codes[1]); /* views-analytics หลัง */
      injectCode(codes[2]); /* views-quote */
      injectCode(codes[3]); /* views-attendance สุดท้าย (ก่อน app.jsx) */
      return loadJsx('app.jsx');
    })
    .catch(function (err) { console.error('[boot]', err); });
}());
  </script>
